const RATE = { traveler: 0.05, host: 0.05, fixed: 150, passTraveler: 4.99, passHost: 9.99 };

function quote(nightly, nights, { travelerPass = false, hostPass = false } = {}) {
  const base = Math.round(nightly * 100) * nights;
  const tCom = travelerPass ? 0 : Math.round(base * RATE.traveler);
  const tFix = travelerPass ? 0 : RATE.fixed;
  const hCom = hostPass ? 0 : Math.round(base * RATE.host);
  const total = base + tCom + tFix;
  const revenue = tCom + tFix + hCom;
  return {
    base: base / 100, travelerCommission: tCom / 100, fixed: tFix / 100,
    total: total / 100, hostCommission: hCom / 100,
    hostPayout: (total - revenue) / 100, revenue: revenue / 100,
  };
}

const eur = (n, d = 2) =>
  n.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d }) + ' €';
const eur0 = (n) => Math.round(n).toLocaleString('fr-FR') + ' €';

/**
 * Chiffre qui se met en valeur quand il change.
 *
 * Le `key` porte la valeur : React remonte donc le nœud à chaque
 * variation, ce qui déclenche l'animation et garantit surtout que le
 * montant affiché est toujours celui de l'état. Une animation pilotée
 * par `requestAnimationFrame` se serait figée dès que l'onglet passe en
 * arrière-plan — inacceptable pour un chiffre.
 */
function Amount({ value, format = eur, className = '' }) {
  return html`<span key=${value} class="inline-block tabular-nums animate-bump ${className}">${format(value)}</span>`;
}

/** Monte le composant avec un léger décalage, pour les entrées en cascade */
function Reveal({ delay = 0, children, className = '' }) {
  const [on, setOn] = useState(false);
  useEffect(() => { const t = setTimeout(() => setOn(true), delay); return () => clearTimeout(t); }, [delay]);
  return html`<div class="${className} transition-all duration-500 ease-out ${on ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-3'}">${children}</div>`;
}

/* Graphique d'aire, tracé à l'apparition */
function Chart({ data, height = 190, accent = '#1F5F46', field = 'gmv' }) {
  const [on, setOn] = useState(false);
  useEffect(() => { const t = setTimeout(() => setOn(true), 120); return () => clearTimeout(t); }, []);
  const W = 640, H = height, pad = 8;
  const max = Math.max(...data.map((d) => d[field])) * 1.12;
  const px = (i) => pad + (i * (W - pad * 2)) / (data.length - 1);
  const py = (v) => H - 22 - (v / max) * (H - 44);
  const pts = data.map((d, i) => [px(i), py(d[field])]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = `${line} L${W - pad} ${H - 22} L${pad} ${H - 22} Z`;
  const last = pts[pts.length - 1];

  return html`
    <svg viewBox="0 0 ${W} ${H}" class="w-full" style=${{ height }} role="img" aria-label="Évolution sur douze mois">
      <defs>
        <linearGradient id="g-${field}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color=${accent} stop-opacity=".28" />
          <stop offset="100%" stop-color=${accent} stop-opacity="0" />
        </linearGradient>
      </defs>
      ${[0.25, 0.5, 0.75].map((f) => html`
        <line key=${f} x1=${pad} x2=${W - pad} y1=${py(max * f)} y2=${py(max * f)}
          stroke="currentColor" class="text-ink/8" stroke-width="1" stroke-dasharray="3 5" />`)}
      <path d=${area} fill="url(#g-${field})"
        class="transition-opacity duration-700" style=${{ opacity: on ? 1 : 0 }} />
      <path d=${line} fill="none" stroke=${accent} stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        style=${{ strokeDasharray: 2000, strokeDashoffset: on ? 0 : 2000, transition: 'stroke-dashoffset 1.4s cubic-bezier(.22,1,.36,1)' }} />
      <circle cx=${last[0]} cy=${last[1]} r="5" fill=${accent}
        class="transition-opacity duration-500" style=${{ opacity: on ? 1 : 0, transitionDelay: '1s' }} />
      <circle cx=${last[0]} cy=${last[1]} r="5" fill=${accent} opacity=".28"
        class="${on ? 'animate-ping-slow' : ''}" style=${{ transformOrigin: `${last[0]}px ${last[1]}px` }} />
      ${data.map((d, i) => i % 2 === 0 && html`
        <text key=${d.m} x=${px(i)} y=${H - 5} text-anchor="middle" font-size="10"
          fill="currentColor" class="text-ink/35">${d.m}</text>`)}
    </svg>`;
}

    requests: INITIAL_REQUESTS, ledger: LEDGER, pass: { host: true, traveler: false },
    moves: [
      { label: 'Revenu — Prairie rivière', date: '2 août', amount: 70.3 },
      { label: 'Pass hôte — 1 mois', date: '1ᵉʳ août', amount: -9.99 },
      { label: 'Virement bancaire', date: '28 juillet', amount: -150 },
    ],
  });

  const toast = useCallback((title, body, tone) => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, title, body, tone }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4200);
  }, []);

  const go = (s) => { setScreen(s); setTick((t) => t + 1); };

  const actions = {
    accept(r) {
      const sp = SPOTS.find((s) => s.id === r.spot);
      const q = quote(sp.price, r.nights);
      setState((st) => ({
        ...st,
        requests: st.requests.map((x) => (x.id === r.id ? { ...x, status: 'confirmed' } : x)),
        escrow: st.escrow + q.hostPayout,
        revenue: st.revenue + q.revenue,
        ledger: [{ label: `Commission — ${sp.title}`, sub: `${r.from} · ${r.nights} nuits à ${eur(sp.price)}`, amount: q.revenue }, ...st.ledger],
      }));
      toast('Réservation acceptée', `${eur(q.hostPayout)} seront versés à la fin du séjour.`);
    },
    decline(r) {
      setState((st) => ({ ...st, requests: st.requests.map((x) => (x.id === r.id ? { ...x, status: 'declined' } : x)) }));
      toast('Demande refusée', 'Le voyageur est intégralement remboursé.', 'clay');
    },
    subscribe(k, label, price) {
      setState((st) => ({
        ...st,
        pass: { ...st.pass, [k]: true },
        balance: st.balance - price,
        revenue: st.revenue + price,
        moves: [{ label: `${label} — 1 mois`, date: "aujourd'hui", amount: -price }, ...st.moves],
        ledger: [{ label: `${label} — 1 mois`, sub: "aujourd'hui", amount: price }, ...st.ledger],
      }));
      toast(`${label} activé`, `${eur(price)} prélevés sur votre solde.`);
    },
    withdraw() { toast('Virement demandé', 'Réception sous 2 à 3 jours ouvrés.'); },
    book(sp, nights, q) { setCtx({ spot: sp, nights, q }); go('checkout'); },
    paid() {
      const { spot: sp, nights, q } = ctx;
      setState((st) => ({
        ...st,
        requests: [{ id: 'n' + Date.now(), spot: sp.id, guest: 'Vous (démonstration)', avatar: 'from-[#8FB07A] to-[#3E7A5E]', from: '12 août', to: `${12 + nights} août`, nights, people: 2, status: 'pending' }, ...st.requests],
        gmv: st.gmv + q.total,
        nights: st.nights + nights,
      }));
      go('success');
      toast('Paiement accepté', `${eur(q.total)} placés en séquestre.`);
    },
    reset() {
      setState({
        balance: 218.45, escrow: 132.6, gmv: 31400, nights: 214, revenue: 44.55,
        requests: INITIAL_REQUESTS, ledger: LEDGER, pass: { host: true, traveler: false },
        moves: [
          { label: 'Revenu — Prairie rivière', date: '2 août', amount: 70.3 },
          { label: 'Pass hôte — 1 mois', date: '1ᵉʳ août', amount: -9.99 },
          { label: 'Virement bancaire', date: '28 juillet', amount: -150 },
        ],
      });
      setToasts([]); setSpot(null); setCtx(null); go('login');
    },
  };

  const mobile = device === 'mobile';
  const logged = screen !== 'login';

  const body = () => {
    switch (screen) {
      case 'login': return html`<${Login} mobile=${mobile} onDone=${() => go('dashboard')} />`;
      case 'dashboard': return html`<${Dashboard} state=${state} actions=${actions} mobile=${mobile} />`;
      case 'explore': return html`<${Explore} mobile=${mobile} onOpen=${(s) => { setSpot(s); go('spot'); }} />`;
      case 'spot': return html`<${SpotDetail} spot=${spot} mobile=${mobile} onBack=${() => go('explore')} onBook=${actions.book} />`;
      case 'checkout': return html`<${Checkout} ctx=${ctx} mobile=${mobile} onBack=${() => go('spot')} onPaid=${actions.paid} />`;
      case 'success': return html`<${Success} ctx=${ctx} onDone=${() => go('dashboard')} />`;
      case 'wallet': return html`<${Wallet} state=${state} actions=${actions} mobile=${mobile} />`;
      case 'company': return html`<${Company} state=${state} mobile=${mobile} />`;
      default: return null;
    }
  };

  /* ── barre de navigation ── */
  const TopNav = () => html`
    <div class="flex items-center gap-5 px-5 h-14 bg-white border-b border-line shrink-0">
      <span class="flex items-center gap-2 font-extrabold tracking-tight">
        <span class="w-7 h-7 rounded-lg bg-forest grid place-items-center"><${I.Tent} class="w-4 h-4 text-clay" /></span>
        CampNest
      </span>
      <nav class="flex items-center gap-1 ml-2">
        ${NAV.map((n) => {
          const Ico = I[n.icon];
          const on = screen === n.k || (n.k === 'explore' && ['spot', 'checkout', 'success'].includes(screen));
          return html`
            <button key=${n.k} onClick=${() => go(n.k)}
              class="relative flex items-center gap-1.5 text-[13px] font-medium px-3 py-1.5 rounded-lg transition-colors ${on ? 'text-forest bg-forest/8' : 'text-ink/55 hover:text-ink hover:bg-ink/[.04]'}">
              <${Ico} class="w-4 h-4" />${n.label}
            </button>`;
        })}
      </nav>
      <div class="ml-auto flex items-center gap-3">
        <button class="relative w-8 h-8 rounded-lg grid place-items-center text-ink/45 hover:text-ink hover:bg-ink/[.04] transition-colors">
          <${I.Bell} class="w-4 h-4" />
          <span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-clay"></span>
        </button>
        <span class="w-8 h-8 rounded-full bg-gradient-to-br from-[#8FB07A] to-[#3E7A5E] ring-2 ring-white shadow-sm"></span>
      </div>
    </div>`;

  const TabBar = () => html`
    <div class="flex border-t border-line bg-white/95 backdrop-blur px-1 pt-2 pb-3 shrink-0">
      ${NAV.map((n) => {
        const Ico = I[n.icon];
        const on = screen === n.k || (n.k === 'explore' && ['spot', 'checkout', 'success'].includes(screen));
        return html`
          <button key=${n.k} onClick=${() => go(n.k)} class="flex-1 grid place-items-center gap-1 transition-colors ${on ? 'text-forest' : 'text-ink/40'}">
            <${Ico} class="w-5 h-5" />
            <span class="text-[9.5px] font-semibold">${n.label.split(' ')[0]}</span>
          </button>`;
      })}
    </div>`;

  /* ── chrome de présentation ── */
  return html`
    <div class="min-h-screen bg-gradient-to-b from-[#EEF1EC] to-[#E3E8E1] py-5 px-3 md:px-6">
      <header class="max-w-[1180px] mx-auto flex flex-wrap items-center gap-3 mb-5">
        <div>
          <p class="text-[10.5px] font-bold uppercase tracking-[.18em] text-forest">Prototype interactif</p>
          <h1 class="text-lg font-extrabold tracking-tight">CampNest — démonstration</h1>
        </div>

        <div class="ml-auto flex items-center gap-2">
          <div class="flex bg-white border border-line rounded-xl p-1 shadow-sm">
            ${[['desktop', 'Monitor', 'Site web'], ['mobile', 'Smartphone', 'Application']].map(([k, ic, lb]) => {
              const Ico = I[ic];
              return html`
                <button key=${k} onClick=${() => setDevice(k)}
                  class="flex items-center gap-1.5 text-[12px] font-semibold px-3 py-1.5 rounded-lg transition-all duration-200 ${device === k ? 'bg-forest text-white shadow-sm' : 'text-ink/50 hover:text-ink'}">
                  <${Ico} class="w-3.5 h-3.5" />${lb}
                </button>`;
            })}
          </div>
          <${Btn} variant="ghost" size="sm" icon=${I.RotateCcw} onClick=${actions.reset}>Rejouer<//>
        </div>
      </header>

      <div class="max-w-[1180px] mx-auto flex justify-center">
        ${mobile
          ? html`
            <div class="relative">
              <div class="w-[390px] max-w-full rounded-[42px] bg-[#0F1410] p-2.5 shadow-2xl shadow-ink/30">
                <div class="relative rounded-[34px] overflow-hidden bg-sand h-[780px] flex flex-col">
                  <div class="h-11 flex items-center justify-between px-6 pt-1 shrink-0 text-[12px] font-bold">
                    <span>9:41</span>
                    <span class="absolute left-1/2 -translate-x-1/2 top-2 w-24 h-6 rounded-full bg-[#0F1410]"></span>
                    <span class="flex items-center gap-1.5"><${I.Wifi} class="w-3.5 h-3.5" /><${I.BatteryFull} class="w-4.5 h-4.5" /></span>
                  </div>
                  <div key=${tick} class="flex-1 overflow-y-auto animate-screen">${body()}</div>
                  ${logged && TabBar()}
                  <${Toasts} items=${toasts} onClose=${(id) => setToasts((t) => t.filter((x) => x.id !== id))} />
                </div>
              </div>
            </div>`
          : html`
            <div class="w-full rounded-2xl overflow-hidden bg-white shadow-2xl shadow-ink/20 border border-line">
              <div class="flex items-center gap-2 px-4 h-10 bg-[#EDF0EB] border-b border-line shrink-0">
                <span class="flex gap-1.5">
                  <span class="w-2.5 h-2.5 rounded-full bg-[#FF5F57]"></span>
                  <span class="w-2.5 h-2.5 rounded-full bg-[#FEBC2E]"></span>
                  <span class="w-2.5 h-2.5 rounded-full bg-[#28C840]"></span>
                </span>
                <span class="mx-auto text-[11px] font-mono text-ink/40 bg-white/70 rounded-md px-3 py-1">
                  campnest.fr${screen === 'login' ? '/connexion' : screen === 'dashboard' ? '/tableau-de-bord' : '/' + screen}
                </span>
              </div>
              <div class="relative bg-sand flex flex-col h-[760px]">
                ${logged && TopNav()}
                <div key=${tick} class="flex-1 overflow-y-auto animate-screen">${body()}</div>
                <${Toasts} items=${toasts} onClose=${(id) => setToasts((t) => t.filter((x) => x.id !== id))} />
              </div>
            </div>`}
      </div>

      <p class="max-w-[1180px] mx-auto text-center text-[11.5px] text-ink/40 mt-5 leading-relaxed">
        Prototype de démonstration — données fictives intégrées, aucun appel réseau, aucune base de données.
        Les montants suivent la grille tarifaire réelle : 1,50 € + 5 % côté voyageur, 5 % côté hôte.
      </p>
    </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
