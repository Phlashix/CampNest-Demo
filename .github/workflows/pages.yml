# ============================================================
# Publication sur GitHub Pages
#
# Le site est déjà constitué de fichiers statiques autonomes :
# il n'y a rien à compiler. Le dépôt est envoyé tel quel.
# ============================================================
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permet de relancer la publication à la main

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; les suivantes attendent leur tour.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
